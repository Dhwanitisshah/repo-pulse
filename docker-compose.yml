services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingest:
    build: ./ingest
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./ingest/.env
    environment:
      REDIS_ADDR: redis:6379

  api:
    build: ./api
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
      CORS_ORIGINS: "http://localhost:5173,http://localhost:4173"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "4173:4173"

volumes:
  redis-data:
